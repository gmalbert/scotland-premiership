name: Scottish Premiership artifact pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

concurrency:
  group: scotland-artifact-pipeline
  cancel-in-progress: false

jobs:
  build-and-validate:
    uses: gmalbert/pitch-oracle-core/.github/workflows/precompute-consumer.yml@b12400c4eca7a471f109c541b82daf9f5637ca7c
    with:
      core_ref: b12400c4eca7a471f109c541b82daf9f5637ca7c
      league_key: scotland
      odds_api_io_bookmakers: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'DraftKings,Bet365' }}
      data_command: >-
        python -m combine_raw_data &&
        python -m fetch_upcoming_fixtures &&
        python scripts/fetch_odds.py &&
        python -m prepare_model_data
      training_command: python -m train_models
      prediction_command: python scripts/precompute_predictions.py
    secrets: inherit
