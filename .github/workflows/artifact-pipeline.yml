name: Scottish Premiership artifact pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

concurrency:
  group: scotland-artifact-pipeline
  cancel-in-progress: false

jobs:
  build-and-validate:
    uses: gmalbert/pitch-oracle-core/.github/workflows/precompute-consumer.yml@64ae637bf0532a9d04f4041d9a2d6f5e3154dc08
    with:
      core_ref: 64ae637bf0532a9d04f4041d9a2d6f5e3154dc08
      league_key: scotland
      odds_api_io_bookmakers: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'DraftKings,Bet365' }}
      data_command: >-
        python -m combine_raw_data &&
        python -m fetch_upcoming_fixtures &&
        python scripts/fetch_odds.py &&
        python -m prepare_model_data
      training_command: python scripts/train_models_with_goal_aliases.py
      prediction_command: python scripts/precompute_predictions.py
    secrets: inherit
