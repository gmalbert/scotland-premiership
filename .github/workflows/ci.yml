name: Consumer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip check
      - run: python -m compileall -q .
      - run: python -m pytest -q
      - name: Verify committed artifacts when present
        run: |
          if [ -f precomputed/cache_manifest.json ] && python -c "import json; from pathlib import Path; from pitch_oracle_core import __version__; raise SystemExit(json.loads(Path('precomputed/cache_manifest.json').read_text())['core_version'] != __version__)"; then
            python scripts/verify_consumer.py
          else
            echo "Skipping artifact verification because no cache matches the installed core version."
          fi
